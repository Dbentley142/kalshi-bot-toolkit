[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-bot-toolkit"
version = "0.1.0"
description = "Open-source Python toolkit for building Kalshi trading bots: edge detection, Kelly position sizing, and fee-aware math."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bot for Kalshi" }]
keywords = [
    "kalshi",
    "kalshi bot",
    "kalshi trading bot",
    "prediction markets",
    "trading bot",
    "kelly criterion",
    "automated trading",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://www.botforkalshi.com"
Source = "https://github.com/Dbentley142/kalshi-bot-toolkit"

[tool.setuptools.packages.find]
include = ["kalshi_bot_toolkit*"]
